<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S Brain Test</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px;max-width:720px;margin:auto}h1{text-align:center;letter-spacing:4px}label{display:block;margin:18px 0 6px}textarea,input{box-sizing:border-box;width:100%;background:#001a1a;color:#fff;border:1px solid #0f0;padding:12px;border-radius:5px;font:inherit}textarea{min-height:110px}button{width:100%;padding:14px;background:#0f0;color:#000;border:0;border-radius:5px;font-weight:bold;cursor:pointer;margin-top:12px}#reply{white-space:pre-wrap;border:1px solid #0f0;padding:12px;margin-top:15px;min-height:100px;color:#fff}small{color:#aaa}#status{margin:15px 0}</style>
</head>
<body>
<h1>J.A.R.V.I.S</h1>
<div id="status">BRAIN: NOT CONNECTED</div>
<label for="key">Gemini API key</label><input id="key" type="password" autocomplete="off" placeholder="Paste your API key here"><small>Key stays in this page while open. Do not share it or this page with a key embedded.</small>
<label for="prompt">Your prompt</label><textarea id="prompt" placeholder="Hello J.A.R.V.I.S"></textarea>
<button id="send">SEND REQUEST</button><div id="reply">Waiting for response...</div>
<script>
const keyEl=document.getElementById('key'), promptEl=document.getElementById('prompt'), reply=document.getElementById('reply'), statusEl=document.getElementById('status'), btn=document.getElementById('send');
btn.addEventListener('click',async()=>{
const key=keyEl.value.trim(),prompt=promptEl.value.trim();
if(!key||!prompt){reply.textContent='Please enter your API key and prompt.';return;}
btn.disabled=true;reply.textContent='PROCESSING...';statusEl.textContent='CONNECTING...';
try{
const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
const data=await response.json();
if(!response.ok)throw new Error(data.error?.message||`HTTP ${response.status}`);
const answer=(data.candidates||[]).flatMap(c=>(c.content?.parts||[]).map(p=>p.text||'')).join('\n').trim();
reply.textContent=answer||'No text returned. '+JSON.stringify(data);statusEl.textContent='✓ BRAIN ONLINE';statusEl.style.color='#0f0';
}catch(err){reply.textContent='ERROR: '+err.message;statusEl.textContent='CONNECTION FAILED';statusEl.style.color='#f66';}
finally{btn.disabled=false;}
});
</script>
</body></html>
