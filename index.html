<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000b19">
<title>J.A.R.V.I.S</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>J.A.R.V.I.S</h1><p>MOBILE EDITION</p></header>
<main>
<div class="core" aria-label="Animated AI core"><div class="ring r1"></div><div class="ring r2"></div><div class="center"></div></div>
<p class="core-text">CORE ACTIVE</p>
<section class="status"><h2>SYSTEM STATUS</h2><div class="row"><span>AI CORE</span><b class="on">● ONLINE</b></div><div class="row"><span>NETWORK</span><b id="network" class="on">● ONLINE</b></div><div class="row"><span>VOICE</span><b id="voice" class="off">● LOCKED</b></div><div class="row"><span>MEMORY</span><b class="off">● LOCKED</b></div></section>
<section class="chat" id="chat" aria-live="polite"><div class="msg ai">J.A.R.V.I.S: Systems online. How may I assist you, Boss?</div></section>
<form class="input-area" id="chat-form"><input id="msg" placeholder="Ask J.A.R.V.I.S..." autocomplete="off" aria-label="Your message"><button id="send" type="submit">SEND</button></form>
<p class="note">DEMO MODE • No AI API connected</p>
</main>
<script src="script.js"></script>
</body>
</html>
